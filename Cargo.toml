[package]
name = "whatsapp-rs"
version = "0.2.1"
edition = "2021"
description = "WhatsApp Web as a small native tray app, on a Chromium we ship"

[[bin]]
name = "whatsapp"
path = "src/main.rs"

# Deliberately dep-light. No image crate (icons are pre-converted to raw RGBA and embedded),
# no serde (the geometry file is five key=value lines, and the one JSON payload that crosses
# a boundary is two fields parsed by hand), no dirs crate (about fifteen lines of std).
#
# What used to be here and is gone with the code that needed it: wry and webkit2gtk (the OS
# webview), servo + winit + euclid + keyboard-types + rustls (the embedded Servo), and
# whatsapp-rust + tokio + qrcode (the native-protocol client). All four were built, measured
# against this one, and deleted; FINDINGS.md keeps the numbers.
[dependencies]
# The engine: Chromium, bundled, embedded as a child of our own window. The `cef` crate tracks
# Chromium 152, the same major the OS webview on this machine runs, so the comparison that
# chose it was engine-to-engine and not version-to-version. `sandbox` is off because CEF's
# Windows sandbox needs a second bootstrap executable, which would make this two binaries.
cef = { version = "152.0.0", default-features = false, features = ["resources"] }

# Unpacking the engine the exe carries. v0.2.0 ships as ONE file: everything the old 17-file
# folder held travels inside the exe as a single zstd frame and unpacks on first run. zstd
# rather than xz because it was measured, not assumed: 128.4 MB against xz -9e's 122.1, and
# 0.50 s to decompress against 3.64 - three seconds off every stranger's first run, for 6 MB
# of extra download. `default-features = false` drops the dictionary builder and the legacy
# format decoders, neither of which a payload we produce ourselves will ever need.
zstd = { version = "0.13", default-features = false }

# Our window, our tray, our menu.
tao = "0.37.0"
tray-icon = "0.24.2"
muda = "0.19.3"

# The host draws the toasts, because the engine will not. See src/notify.rs.
notify-rust = "4.18"

# Windows-only: the AppUserModelID and the Start Menu shortcut that carries it, without which
# Windows silently drops every toast, and the SetWindowPos that keeps the browser's child
# window the size of ours.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # The Start Menu shortcut (shortcut.rs): IShellLinkW + IPersistFile + IPropertyStore, a
  # VT_LPWSTR PROPVARIANT, and PKEY_AppUserModel_ID.
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  # PKEY_AppUserModel_ID lives in EnhancedStorage, of all places.
  "Win32_Storage_EnhancedStorage",
  # engine.rs: SetDllDirectoryW, and the LoadLibraryExW that pulls chrome_elf.dll and the
  # delay-loaded libcef.dll out of the unpacked engine folder.
  "Win32_System_LibraryLoader",
  # watchdog.rs: GetProcessMemoryInfo over this process and, through a one-level Toolhelp32
  # walk, the engine children it spawned - which is how the app notices its own memory
  # running away. See the 2026-09-09 incident.
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  # setup_window.rs: the progress bar (InitCommonControlsEx, PROGRESS_CLASSW), the system UI
  # font its two lines are drawn in, and the DPI it scales itself by.
  "Win32_UI_Controls",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
]

# Embeds the Windows manifest: common controls v6 and per-monitor DPI awareness. See build.rs.
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-manifest = "1.5.0"
# The executable's icon and version block. Needs rc.exe from the Windows SDK, which
# tools/build.ps1 puts on PATH along with the rest of the MSVC environment.
winresource = "0.1"

[profile.release]
# opt-level "z" and whole-program LTO buy nothing here and cost minutes: almost all the code in
# this app is behind an FFI boundary in a 272 MB prebuilt DLL. The binary is ~17 MB either way,
# against 325 MB of engine beside it.
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
